workflows:
  android-release:
    name: Android Release APK
    max_build_duration: 120
    environment:
      flutter: 3.24.0
      android: true
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Build APK
        script: |
          cd android && ./gradlew assembleRelease --no-daemon
    artifacts:
      - build/app/outputs/flutter-apk/**/*.apk
